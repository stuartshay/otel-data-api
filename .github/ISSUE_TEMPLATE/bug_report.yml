---
name: Bug Report
description: Report a bug in otel-data-api
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.

  - type: input
    id: endpoint
    attributes:
      label: Affected Endpoint
      description: Which API endpoint is affected?
      placeholder: "e.g., GET /api/v1/locations, POST /api/v1/reference-locations"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or response bodies.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does this occur?
      options:
        - Production (k8s-pi5-cluster)
        - Local development (make dev)
        - Docker container
        - CI pipeline
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: API version from /health endpoint
      placeholder: "e.g., 1.0.158"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output (pod logs, uvicorn output, traceback).
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have checked the existing issues for duplicates
          required: true
        - label: I have tested with the latest version on master

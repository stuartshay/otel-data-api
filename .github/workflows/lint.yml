name: Lint, Validate and Test

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create venv and install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        run: |
          mkdir -p output
          pytest --cov=app --cov-report=xml:output/coverage.xml --cov-report=term-missing --cov-report=json:output/coverage.json tests/

      - name: Verify imports
        run: |
          python -c "from app import create_app; print('✓ App factory imports successfully')"

      - name: Coverage Report
        if: always()
        run: |
          if [ -f output/coverage.json ]; then
            {
              echo "## Test Coverage Report"
              echo ""
              echo "| Category | Covered | Missing | Percentage |"
              echo "|----------|---------|---------|------------|"
              for key in statements branches; do
                if [ "$key" = "statements" ]; then
                  covered=$(jq -r '.totals.covered_lines' output/coverage.json)
                  total=$(jq -r '.totals.num_statements' output/coverage.json)
                  missing=$(jq -r '.totals.missing_lines' output/coverage.json)
                  pct=$(jq -r '.totals.percent_covered_display' output/coverage.json)
                  threshold=85
                else
                  covered=$(jq -r '.totals.covered_branches' output/coverage.json)
                  total=$(jq -r '.totals.num_branches' output/coverage.json)
                  missing=$(jq -r '.totals.missing_branches' output/coverage.json)
                  pct=$(jq -r '(.totals.covered_branches / .totals.num_branches * 100) | floor' output/coverage.json)
                  threshold=85
                fi
                icon="✅"
                if awk "BEGIN {exit !($pct < $threshold)}"; then icon="⚠️"; fi
                echo "| ${icon} ${key^} | ${covered}/${total} | ${missing} | ${pct}% |"
              done
              echo ""
              echo "_Threshold: 85% (enforced by pyproject.toml)_"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Test Coverage Report"
              echo ""
              echo "⚠️ No coverage data generated"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt || true

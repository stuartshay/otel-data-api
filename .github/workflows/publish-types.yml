name: Publish Types Package

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TYPES_PKG_DIR: packages/otel-data-types

jobs:
  publish:
    name: Generate & Publish Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Generate OpenAPI spec and TypeScript types
        run: |
          npm install -g openapi-typescript@7.10.1
          bash scripts/generate-types.sh

      - name: Set package version from release tag
        run: |
          # Extract version from tag (v1.0.8 → 1.0.8)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          cd ${{ env.TYPES_PKG_DIR }}
          npm version "$TAG_VERSION" --no-git-tag-version
          echo "Package version: $TAG_VERSION"

      - name: Publish to npm
        run: |
          cd ${{ env.TYPES_PKG_DIR }}
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get published version
        id: types_version
        run: |
          PKG_VERSION=$(jq -r '.version' ${{ env.TYPES_PKG_DIR }}/package.json)
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Trigger otel-data-gateway types update
        id: gateway_dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITOPS_PAT }}
          repository: stuartshay/otel-data-gateway
          event-type: otel-data-types-release
          client-payload: '{"version": "${{ steps.types_version.outputs.version }}"}'
        continue-on-error: true

      - name: Attach OpenAPI spec to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            docs/openapi.json \
            --clobber

      - name: Summary
        run: |
          if [ "${{ steps.gateway_dispatch.outcome }}" = "success" ]; then
            DISPATCH_STATUS="✅"
          else
            DISPATCH_STATUS="❌ (${{ steps.gateway_dispatch.outcome }})"
          fi
          {
            echo "## npm Package Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Package | \`@stuartshay/otel-data-types\` |"
            echo "| Version | \`${{ steps.types_version.outputs.version }}\` |"
            echo "| Release | \`${{ github.event.release.tag_name }}\` |"
            echo "| Spec | \`docs/openapi.json\` attached |"
            echo "| Gateway Dispatch | ${DISPATCH_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

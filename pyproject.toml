[project]
authors = [{name = "Stuart Shay"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: GIS",
]
description = "FastAPI microservice for owntracks/Garmin GPS data with PostGIS spatial queries"
keywords = ["fastapi", "postgresql", "postgis", "owntracks", "garmin", "gps"]
license = {text = "MIT"}
name = "otel-data-api"
readme = "README.md"
requires-python = ">=3.14"
version = "1.0.0"

[project.urls]
Homepage = "https://github.com/stuartshay/otel-data-api"
Repository = "https://github.com/stuartshay/otel-data-api.git"

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  "ARG001", # unused function argument
  "ARG002", # unused method argument
  "UP046", # PEP 695 generics not fully supported by Pydantic
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
data_file = "output/.coverage"
omit = ["tests/*", "venv/*", "setup.py"]
source = ["app"]

[tool.coverage.json]
output = "output/coverage.json"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true

[tool.mypy]
disallow_untyped_defs = false
ignore_missing_imports = true
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
